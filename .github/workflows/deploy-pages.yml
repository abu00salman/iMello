name: Deploy web to GitHub Pages

# Repository Settings → Pages → Source must be "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: ["claude/imello-messenger-dev-12zxqe"]
    paths: ["apps/web/**", "packages/**", ".github/workflows/deploy-pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          # "/" when a custom domain (e.g. imello.abu00salman.com) is set; otherwise /<repo>/.
          VITE_BASE: ${{ vars.IMELLO_PAGES_BASE || format('/{0}/', github.event.repository.name) }}
          VITE_CSP_META: "true"
          # Until a server exists these point nowhere; the sign-in screen says so.
          VITE_API_URL: ${{ vars.IMELLO_API_URL || 'https://imello-api.abu00salman.com' }}
          VITE_HOMESERVER_URL: ${{ vars.IMELLO_HOMESERVER_URL || 'https://imello-matrix.abu00salman.com' }}
        run: pnpm --filter @imello/web run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
