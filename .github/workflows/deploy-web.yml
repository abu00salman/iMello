name: Deploy web client

# Manual only: deploying is an outward-facing action that needs an owner's decision.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          VITE_API_URL: ${{ vars.IMELLO_API_URL }}
          VITE_HOMESERVER_URL: ${{ vars.IMELLO_HOMESERVER_URL }}
        run: |
          test -n "$VITE_API_URL" && test -n "$VITE_HOMESERVER_URL"
          pnpm --filter @imello/web run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/web/dist --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch "${{ inputs.environment }}"
