name: Native test builds (APK + unsigned IPA)

# Test builds without Expo or Apple accounts:
#  - Android: release APK signed with the default *debug* key (installable by sideloading; not for Play Store).
#  - iOS: UNSIGNED .ipa. It will NOT install on a normal iPhone as-is; it must be re-signed
#    (e.g. Sideloadly/AltStore with your Apple ID, or a paid Apple Developer certificate).
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Wanas API URL baked into the app"
        required: false
        default: ""
  push:
    branches: ["claude/**", "cursor/**"]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/native-test-builds.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/native-test-builds.yml"

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  IMELLO_API_URL: ${{ inputs.api_url || vars.IMELLO_API_URL || 'https://imello-api.abu00salman.com' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pnpm install --frozen-lockfile
      - name: Build headless crypto engine
        run: pnpm --filter @imello/mobile run build:engine
      - name: Generate native Android project
        working-directory: apps/mobile
        env: { CI: "1" }
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (debug-key signed)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Collect APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/Wanas-1.0.0-test.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Wanas-android-apk
          path: out/Wanas-1.0.0-test.apk
          retention-days: 14

  ios:
    name: iOS unsigned IPA
    # Expo SDK 58's expo-modules-jsi compiles from source and needs a newer Swift than Xcode 26.3.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build headless crypto engine
        run: pnpm --filter @imello/mobile run build:engine
      - name: Generate native iOS project (+ CocoaPods)
        working-directory: apps/mobile
        env: { CI: "1" }
        run: npx expo prebuild --platform ios
      - name: Archive without code signing
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Wanas.xcworkspace -scheme Wanas -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Wanas.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              echo "::group::xcodebuild errors"
              grep -nE "error:|fatal error|\*\* ARCHIVE FAILED|Command PhaseScriptExecution failed" "$RUNNER_TEMP/xcodebuild.log" | head -n 60
              echo "::endgroup::"
              grep -nE -B3 -A25 "PhaseScriptExecution|error:" "$RUNNER_TEMP/xcodebuild.log" | grep -vE "^\s*[0-9]+-\s*$" | head -n 200
              exit 1
            }
          tail -n 5 "$RUNNER_TEMP/xcodebuild.log"
      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload" out
          cp -R "$RUNNER_TEMP/Wanas.xcarchive/Products/Applications/Wanas.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/Wanas-1.0.0-unsigned.ipa" Payload)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Wanas-ios-unsigned-ipa
          path: out/Wanas-1.0.0-unsigned.ipa
          retention-days: 14
      - name: Simulator must leave the splash
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Wanas.xcworkspace -scheme Wanas -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          APP=$(find "$RUNNER_TEMP/sim-dd/Build/Products" -name 'Wanas.app' -type d | head -1)
          echo "APP=$APP"
          test -n "$APP"
          DEVICE=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "DEVICE=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.abu00salman.wanas
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" com.abu00salman.wanas data)
          MARKER=""
          for _ in $(seq 1 30); do
            MARKER=$(find "$CONTAINER" -name imello-boot.txt -print -quit || true)
            if [ -n "$MARKER" ]; then break; fi
            sleep 2
          done
          mkdir -p "$GITHUB_WORKSPACE/out"
          xcrun simctl io "$DEVICE" screenshot "$GITHUB_WORKSPACE/out/ios-simulator-past-splash.png" || true
          if [ -z "$MARKER" ]; then
            echo "app did not leave the splash (no imello-boot.txt)"
            exit 1
          fi
          echo "boot marker: $(cat "$MARKER")"
          grep -Eq '^(out|in)$' "$MARKER"
      - name: Arabic fixture screens (no account data)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices | grep Booted | sed -E 's/.*\(([A-F0-9-]+)\) \(Booted\).*/\1/' | head -1)
          echo "DEVICE=$DEVICE"
          test -n "$DEVICE"
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" com.abu00salman.wanas data)
          DOCS="$CONTAINER/Documents"
          mkdir -p "$DOCS" "$GITHUB_WORKSPACE/out"
          # A custom-scheme URL raises “Open in Wanas?” and never navigates.
          # The app reads this file on the next launch and opens the fixture.
          capture() {
            local screen="$1"
            local file="$2"
            rm -f "$DOCS/imello-preview-shown.txt"
            printf 'ar %s\n' "$screen" > "$DOCS/imello-preview.txt"
            xcrun simctl terminate "$DEVICE" com.abu00salman.wanas || true
            xcrun simctl launch "$DEVICE" com.abu00salman.wanas
            local shown=""
            for _ in $(seq 1 30); do
              shown=$(cat "$DOCS/imello-preview-shown.txt" 2>/dev/null || true)
              if [ "$shown" = "ar $screen" ]; then break; fi
              sleep 1
            done
            echo "shown=$shown"
            test "$shown" = "ar $screen"
            xcrun simctl io "$DEVICE" screenshot "$GITHUB_WORKSPACE/out/${file}"
            test -s "$GITHUB_WORKSPACE/out/${file}"
          }
          capture chats ios-simulator-ar-chats.png
          capture chat ios-simulator-ar-chat.png
          capture ping ios-simulator-ar-ping.png
          capture signin ios-simulator-ar-signin.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshot
          path: |
            out/ios-simulator-past-splash.png
            out/ios-simulator-ar-chats.png
            out/ios-simulator-ar-chat.png
            out/ios-simulator-ar-ping.png
            out/ios-simulator-ar-signin.png
          if-no-files-found: ignore
          retention-days: 14
