# Production-style single-host deployment: PostgreSQL + Synapse + iMello API + Caddy (TLS).
# STATUS: template, not yet validated end-to-end (see docs/DEPLOYMENT.md).
#
#   cp .env.example .env   # fill in secrets
#   python3 scripts/render-synapse-config.py infrastructure/docker/synapse-data   (with env exported, see DEPLOYMENT.md)
#   docker compose -f infrastructure/docker/docker-compose.yml --env-file .env up -d

name: imello

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imello
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: imello
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-synapse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imello"]
      interval: 5s
      retries: 20
    networks: [backend]

  api:
    build: { context: ../.., dockerfile: services/api/Dockerfile }
    restart: unless-stopped
    env_file: ../../.env
    environment:
      HOMESERVER_URL: http://synapse:8008
      PUBLIC_HOMESERVER_URL: https://${IMELLO_MATRIX_DOMAIN}
    depends_on: { postgres: { condition: service_healthy } }
    networks: [backend, edge]

  synapse:
    image: ghcr.io/element-hq/synapse:latest
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      PYTHONPATH: /modules
    volumes:
      - ./synapse-data:/data
      - ../synapse/modules:/modules:ro
    depends_on: { postgres: { condition: service_healthy }, api: { condition: service_started } }
    networks: [backend, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: ../../.env
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ../../apps/web/dist:/srv/web:ro
      - caddy_data:/data
    depends_on: [api, synapse]
    networks: [edge]

# The policy API's /internal routes are reachable only on the backend network;
# Caddy refuses to proxy them.
networks:
  backend: { internal: true }
  edge: {}

volumes:
  pgdata: {}
  caddy_data: {}
