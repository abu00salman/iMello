# iMello Synapse configuration template.
# Rendered by scripts/render-synapse-config.py — values in ${...} come from the
# environment. Never commit a rendered copy: it contains secrets.

server_name: "${MATRIX_SERVER_NAME}"
public_baseurl: "${PUBLIC_HOMESERVER_URL}/"
pid_file: "${SYNAPSE_DATA_DIR}/homeserver.pid"
signing_key_path: "${SYNAPSE_DATA_DIR}/signing.key"
media_store_path: "${SYNAPSE_DATA_DIR}/media_store"
log_config: "${SYNAPSE_DATA_DIR}/log.config"
report_stats: false

listeners:
  - port: ${SYNAPSE_PORT}
    bind_addresses: ["${SYNAPSE_BIND}"]
    type: http
    tls: false            # TLS is terminated by the reverse proxy in production.
    x_forwarded: ${SYNAPSE_X_FORWARDED}
    resources:
      - names: [client]
        compress: false

database:
  name: psycopg2
  args:
    user: "${SYNAPSE_DB_USER}"
    password: "${SYNAPSE_DB_PASSWORD}"
    dbname: "${SYNAPSE_DB_NAME}"
    host: "${SYNAPSE_DB_HOST}"
    port: ${SYNAPSE_DB_PORT}
    cp_min: 2
    cp_max: 10

# ── Accounts ────────────────────────────────────────────────────────────────
# Accounts are created only by the iMello API (which validates usernames,
# rate-limits and records account type) using the shared secret below.
enable_registration: false
registration_shared_secret: "${SYNAPSE_REGISTRATION_SHARED_SECRET}"
password_config:
  enabled: true
  minimum_length: 10   # mirrored in @imello/core validation
allow_guest_access: false

# ── Privacy: no stranger discovery ─────────────────────────────────────────
user_directory:
  enabled: false
require_auth_for_profile_requests: true
limit_profile_requests_to_users_who_share_rooms: true
include_profile_data_on_invite: true
allow_public_rooms_without_auth: false
allow_public_rooms_over_federation: false
room_list_publication_rules:
  - action: deny
presence:
  enabled: false        # Do not broadcast online status by default.
limit_remote_rooms:
  enabled: true
  complexity: 0.5

# Closed network for the MVP: no federation with other homeservers.
federation_domain_whitelist: []
trusted_key_servers: []
suppress_key_server_warning: true

# ── Encryption defaults ─────────────────────────────────────────────────────
# Every private room is encrypted on creation (iMello clients also set it explicitly).
encryption_enabled_by_default_for_room_type: all
# Unencrypted message retention is irrelevant for E2EE content; keep server-side
# metadata minimal. (Disappearing-message retention policies: see docs/ROADMAP.md.)
redaction_retention_period: 1d
user_ips_max_age: 14d

# ── Media ───────────────────────────────────────────────────────────────────
max_upload_size: 100M
url_preview_enabled: false   # URL previews would leak links to the server.
enable_authenticated_media: true

# ── Rate limiting ───────────────────────────────────────────────────────────
rc_message:
  per_second: ${SYNAPSE_RC_MESSAGE_PER_SECOND}
  burst_count: ${SYNAPSE_RC_MESSAGE_BURST}
rc_login:
  address: { per_second: ${SYNAPSE_RC_LOGIN_PER_SECOND}, burst_count: ${SYNAPSE_RC_LOGIN_BURST} }
  account: { per_second: ${SYNAPSE_RC_LOGIN_PER_SECOND}, burst_count: ${SYNAPSE_RC_LOGIN_BURST} }
  failed_attempts: { per_second: 0.1, burst_count: 5 }
rc_invites:
  per_room: { per_second: 0.3, burst_count: 10 }
  per_user: { per_second: 0.1, burst_count: 10 }

# ── iMello policy enforcement ──────────────────────────────────────────────
modules:
  - module: imello_policy.ImelloPolicy
    config:
      policy_url: "${POLICY_URL}"
      policy_secret: "${POLICY_INTERNAL_SECRET}"

macaroon_secret_key: "${SYNAPSE_MACAROON_SECRET_KEY}"
form_secret: "${SYNAPSE_FORM_SECRET}"
