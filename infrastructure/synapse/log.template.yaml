# Synapse logging. INFO level logs request lines and IDs, never decrypted
# message content (the server never has it). Keep DEBUG off in production.
version: 1
formatters:
  precise:
    format: "%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s"
handlers:
  file:
    class: logging.handlers.TimedRotatingFileHandler
    formatter: precise
    filename: "${SYNAPSE_DATA_DIR}/homeserver.log"
    when: midnight
    backupCount: 7
    encoding: utf8
loggers:
  synapse.storage.SQL:
    level: WARNING
root:
  level: INFO
  handlers: [file]
disable_existing_loggers: false
